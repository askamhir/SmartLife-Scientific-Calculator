
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLife Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>

    <header>
        <div class="logo">
            <span class="logo-icon">✦</span>
            <div>
                <h2>SmartLife</h2>
                <p>SCIENTIFIC CALCULATOR</p>
            </div>
        </div>

        <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">
            ☀️
        </button>
    </header>

    <main>
        <section class="calculator">

            <div class="calculator-top">
                <div>
                    <span class="status-dot"></span>
                    <span class="online-text">SYSTEM ONLINE</span>
                </div>
                <span class="version">V 1.0</span>
            </div>

            <div class="display">
                <div class="display-label">CALCULATION</div>
                <div id="history" class="history"></div>
                <input
                    type="text"
                    id="screen"
                    value="0"
                    readonly
                    aria-label="Calculator display"
                >
                <div class="display-bottom">
                    <span id="modeText">DEG MODE</span>
                    <span>SMART CALCULATOR</span>
                </div>
            </div>

            <div class="mode-row">
                <button id="angleToggle" class="mode-btn active">DEG</button>
                <span class="mode-description">ANGLE MODE</span>
                <span class="powered">POWERED BY SMARTLIFE</span>
            </div>

            <div class="buttons">

                <button class="btn function" data-action="clear">AC</button>
                <button class="btn function" data-action="delete">DEL</button>
                <button class="btn function" data-value="(">(</button>
                <button class="btn function" data-value=")">)</button>
                <button class="btn operator" data-value="/">÷</button>

                <button class="btn scientific" data-action="sin">sin</button>
                <button class="btn scientific" data-action="cos">cos</button>
                <button class="btn scientific" data-action="tan">tan</button>
                <button class="btn scientific" data-action="sqrt">√</button>
                <button class="btn operator" data-value="^">xʸ</button>

                <button class="btn scientific" data-action="log">log</button>
                <button class="btn scientific" data-action="ln">ln</button>
                <button class="btn scientific" data-action="factorial">n!</button>
                <button class="btn scientific" data-value="3.141592653589793">π</button>
                <button class="btn operator" data-value="*">×</button>

                <button class="btn number" data-value="7">7</button>
                <button class="btn number" data-value="8">8</button>
                <button class="btn number" data-value="9">9</button>
                <button class="btn function" data-action="percent">%</button>
                <button class="btn operator" data-value="-">−</button>

                <button class="btn number" data-value="4">4</button>
                <button class="btn number" data-value="5">5</button>
                <button class="btn number" data-value="6">6</button>
                <button class="btn scientific" data-action="square">x²</button>
                <button class="btn operator" data-value="+">+</button>

                <button class="btn number" data-value="1">1</button>
                <button class="btn number" data-value="2">2</button>
                <button class="btn number" data-value="3">3</button>
                <button class="btn scientific" data-value="2.718281828459045">e</button>
                <button class="btn operator" data-action="sign">+/−</button>

                <button class="btn number zero" data-value="0">0</button>
                <button class="btn number" data-value=".">.</button>
                <button class="btn equals" data-action="calculate">=</button>

            </div>

            <div class="calculator-footer">
                <span>✦ PRECISION CALCULATIONS</span>
                <span>SMARTLIFE © 2026</span>
            </div>

        </section>
    </main>

    <footer>
        Designed by Mahir Bin Aqeel
    </footer>

    <script src="script.js"></script>
</body>
</html>
